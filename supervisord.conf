[supervisord]
nodaemon=true

[program:ttyd]
command=/usr/local/bin/ttyd -p 7681 -W /bin/bash -l
directory=/workspace
autorestart=true

[program:git-sync]
command=/git-sync.sh
directory=/workspace
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=false

[program:health-ping]
command=bash -c "while true; do curl -s http://127.0.0.1:8080/health > /dev/null; sleep 500; done"
autorestart=true
